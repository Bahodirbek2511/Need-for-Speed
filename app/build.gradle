plugins {
    id "com.android.application"
}

android {
    namespace "uz.bahodirbek.nfsstreetrush"
    compileSdk 35

    defaultConfig {
        applicationId "uz.bahodirbek.nfsstreetrush"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }
}
