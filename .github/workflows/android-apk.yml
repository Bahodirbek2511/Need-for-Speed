name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile and verify APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install required Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK package and archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Need-for-Speed-Street-Rush.apk
          APK=dist/Need-for-Speed-Street-Rush.apk
          test -s "$APK"
          SIZE="$(stat -c '%s' "$APK")"
          test "$SIZE" -gt 50000
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > dist/apk-badging.txt
          grep -q "package: name='uz.bahodirbek.nfsstreetrush'" dist/apk-badging.txt
          grep -q "launchable-activity:" dist/apk-badging.txt
          echo "APK verification passed: $SIZE bytes"
          grep -E "^(package:|sdkVersion:|targetSdkVersion:|launchable-activity:)" dist/apk-badging.txt || true
          sha256sum "$APK" | tee dist/SHA256SUMS.txt

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Need-for-Speed-Street-Rush-APK
          path: |
            dist/Need-for-Speed-Street-Rush.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: android-build-${{ github.run_id }}-${{ github.run_attempt }}
          name: Need for Speed Street Rush — Build ${{ github.run_number }}.${{ github.run_attempt }}
          artifacts: dist/Need-for-Speed-Street-Rush.apk,dist/SHA256SUMS.txt
          artifactContentType: application/vnd.android.package-archive
          body: |
            Automatically built Android APK from the repository source.
            APK validation checks passed in GitHub Actions.
            This is an original NFS-inspired arcade racer, not an EA game.
          makeLatest: true
          allowUpdates: false
          removeArtifacts: false
